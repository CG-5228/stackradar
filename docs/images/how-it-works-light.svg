<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-label="StackRadar topology: a read-only scanner in your cluster sends SBOMs and inventory to the server over a cluster-scoped key; the server mirrors OSV.dev, EPSS and CISA KEV locally and stores everything in one PostgreSQL; the browser reaches the client only.">
<defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#59636e"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0969da"/></marker><marker id="arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#818b98"/></marker></defs>
<rect x="24" y="96" width="244" height="348" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><rect x="40" y="111" width="16" height="6" rx="1.5" fill="none" stroke="#59636e" stroke-width="1.5"/><rect x="40" y="119" width="16" height="6" rx="1.5" fill="none" stroke="#59636e" stroke-width="1.5"/><circle cx="43" cy="114" r="1" fill="#59636e"/><circle cx="43" cy="122" r="1" fill="#59636e"/><text x="62" y="120" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Your Kubernetes cluster</text><rect x="40" y="132" width="212" height="86" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><path d="M64 148 L71 152 V160 L64 164 L57 160 V152 Z M57 152 L64 156 L71 152 M64 156 V164" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="158" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Pods</text><text x="54" y="178" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">Every namespace, every container.</text><rect x="54" y="186" width="24" height="20" rx="5" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="66" y="199.42" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="9.5" font-weight="400" fill="#59636e" text-anchor="middle">ci</text><rect x="84" y="186" width="48" height="20" rx="5" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="108" y="199.42" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="9.5" font-weight="400" fill="#59636e" text-anchor="middle">argocd</text><rect x="138" y="186" width="71" height="20" rx="5" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="173.5" y="199.42" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="9.5" font-weight="400" fill="#59636e" text-anchor="middle">monitoring</text><path d="M146 218 V252" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="70" y="226" width="152" height="20" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="146" y="239.78" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">list, watch (read-only)</text><rect x="40" y="254" width="212" height="100" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><path d="M56 275 V272 a2 2 0 0 1 2 -2 H61 M67 270 H70 a2 2 0 0 1 2 2 V275 M72 281 V284 a2 2 0 0 1 -2 2 H67 M61 286 H58 a2 2 0 0 1 -2 -2 V281 M59 278 H69" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="280" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">stackradar-scanner</text><text x="54" y="300" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">Pod informer. Pulls each image</text><text x="54" y="315" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">once per digest and writes its</text><text x="54" y="330" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">CycloneDX SBOM with Syft.</text><text x="40" y="384" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#818b98" text-anchor="start">No create, update, delete or patch</text><text x="40" y="399" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#818b98" text-anchor="start">on anything. No telemetry.</text><rect x="372" y="96" width="280" height="348" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><circle cx="396" cy="118" r="7" fill="none" stroke="#0969da" stroke-width="4"/><text x="410" y="120" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#59636e" text-anchor="start">StackRadar</text><rect x="388" y="136" width="248" height="74" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="403.5" y="153" width="17" height="14" rx="2.5" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M403.5 157.5 H420.5" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="406.5" cy="155.25" r="0.9" fill="#59636e"/><circle cx="409.5" cy="155.25" r="0.9" fill="#59636e"/><text x="428" y="162" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">client</text><text x="402" y="182" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">Next.js UI and BFF. Owns sign-in;</text><text x="402" y="197" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">the only thing a browser talks to.</text><rect x="388" y="260" width="248" height="88" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><circle cx="412" cy="284" r="7" fill="none" stroke="#0969da" stroke-width="4"/><text x="428" y="286" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">server</text><text x="402" y="306" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">API, job worker, sync schedule.</text><text x="402" y="321" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">Matches every SBOM against the</text><text x="402" y="336" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="start">mirror and ranks every finding.</text><rect x="388" y="380" width="248" height="48" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><ellipse cx="412" cy="399" rx="7" ry="3" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M405 399 V409 a7 3 0 0 0 14 0 V399 M405 404 a7 3 0 0 0 14 0" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="406" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">PostgreSQL</text><text x="622" y="410" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#59636e" text-anchor="end">one database</text><path d="M512 210 V258" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="445" y="224" width="134" height="20" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="512" y="237.78" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">internal service key</text><path d="M512 348 V378" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="437" y="16" width="150" height="44" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="452.5" y="31" width="17" height="14" rx="2.5" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M452.5 35.5 H469.5" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="455.5" cy="33.25" r="0.9" fill="#59636e"/><circle cx="458.5" cy="33.25" r="0.9" fill="#59636e"/><text x="477" y="42" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Browser</text><path d="M512 60 V134" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="483" y="72" width="58" height="20" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="512" y="85.78" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">session</text><path d="M252 304 H386" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/><rect x="264.5" y="280" width="111" height="20" rx="10" fill="#ddf4ff" stroke="none" stroke-width="1"/><text x="320" y="293.78" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#0969da" text-anchor="middle">SBOM + inventory</text><rect x="250" y="308" width="140" height="20" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="320" y="321.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#59636e" text-anchor="middle">cluster-scoped API key</text><rect x="764" y="96" width="172" height="348" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><circle cx="788" cy="118" r="7.5" fill="none" stroke="#59636e" stroke-width="1.5"/><path d="M780.5 118 H795.5 M788 110.5 a11 11 0 0 1 0 15 M788 110.5 a11 11 0 0 0 0 15" fill="none" stroke="#59636e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><text x="802" y="120" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Advisory feeds</text><text x="780" y="148" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#818b98" text-anchor="start">Fetched by the server on a</text><text x="780" y="163" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#818b98" text-anchor="start">schedule. Nothing is sent</text><text x="780" y="178" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#818b98" text-anchor="start">anywhere to be scored.</text><rect x="802" y="230" width="118" height="44" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="814" y="249" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">OSV.dev</text><text x="814" y="265" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#59636e" text-anchor="start">hourly</text><path d="M802 252 H786" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="802" y="282" width="118" height="44" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="814" y="301" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">EPSS</text><text x="814" y="317" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#59636e" text-anchor="start">daily</text><path d="M802 304 H786" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="802" y="334" width="118" height="44" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="814" y="353" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">CISA KEV</text><text x="814" y="369" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#59636e" text-anchor="start">daily</text><path d="M802 356 H786" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M786 252 V356" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M786 304 H638" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3" marker-end="url(#arrow-faint)"/><rect x="655.5" y="280" width="111" height="20" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="711" y="293.78" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">mirrored locally</text>
</svg>
